# .github/workflows/build.yml

name: Build Free Fire Panel APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # হাতে trigger করতে পারবে

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      # ── ১. কোড নিয়ে আসো ──────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── ২. Java (Android SDK লাগে) ────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── ৩. Python ─────────────────────────────────────────
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ── ৪. System dependencies ────────────────────────────
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip \
            libffi-dev libssl-dev \
            build-essential \
            libpython3-dev \
            autoconf libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      # ── ৫. Buildozer + Cython ─────────────────────────────
      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install cython==0.29.36

      # ── ৬. Android SDK/NDK cache (build fast করবে) ───────
      - name: Cache buildozer global dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # ── ৭. APK Build ──────────────────────────────────────
      - name: Build APK
        run: |
          yes | buildozer android debug 2>&1 | tee build.log

      # ── ৮. APK upload (GitHub থেকে download করবে) ─────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffpanel-debug-apk
          path: bin/*.apk
          retention-days: 30

      # ── ৯. Build log (error হলে দেখবে) ──────────────────
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
